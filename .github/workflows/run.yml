name: Build NetForgeCN rules dat files

on:
  workflow_dispatch:
  schedule:
    # Every 30 min; the guard step decides whether upstream is >=2h old.
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      upstream_tag: ${{ steps.vars.outputs.upstream_tag }}
      built: ${{ steps.vars.outputs.built }}
    steps:
      - name: Checkout this repo (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: selfrepo
          fetch-depth: 0

      - name: Set variables and upstream guard
        id: vars
        run: |
          set -euo pipefail
          echo "RELEASE_NAME=Released on $(date -u +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date -u +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "CHINA_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf" >> $GITHUB_ENV
          echo "GOOGLE_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf" >> $GITHUB_ENV
          echo "APPLE_DOMAINS_URL=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/apple.china.conf" >> $GITHUB_ENV
          echo "EASYLISTCHINA_EASYLIST_REJECT_URL=https://easylist-downloads.adblockplus.org/easylistchina+easylist.txt" >> $GITHUB_ENV
          echo "PETERLOWE_REJECT_URL=https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=1&mimetype=plaintext" >> $GITHUB_ENV
          echo "ADGUARD_DNS_REJECT_URL=https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt" >> $GITHUB_ENV
          echo "DANPOLLOCK_REJECT_URL=https://someonewhocares.org/hosts/hosts" >> $GITHUB_ENV
          echo "CUSTOM_DIRECT=https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/cn.txt" >> $GITHUB_ENV
          echo "CUSTOM_PROXY=https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/geolocation-!cn.txt" >> $GITHUB_ENV
          echo "WIN_SPY=https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt" >> $GITHUB_ENV
          echo "WIN_UPDATE=https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/update.txt" >> $GITHUB_ENV
          echo "WIN_EXTRA=https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/extra.txt" >> $GITHUB_ENV

          # Load custom ad source URLs from override config
          source ./selfrepo/override/custom-sources.env
          echo "ANTIAD_URL=$ANTIAD_URL" >> $GITHUB_ENV
          echo "ADRULES_URL=$ADRULES_URL" >> $GITHUB_ENV
          echo "NEODEV_URL=$NEODEV_URL" >> $GITHUB_ENV

          # Query upstream latest release time (UTC ISO8601) via GitHub API
          UPSTREAM_TAG=$(curl -fsSL --retry 3 -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Loyalsoldier/v2ray-rules-dat/releases/latest \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("tag_name",""))')
          UPSTREAM_PUBLISHED=$(curl -fsSL --retry 3 -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Loyalsoldier/v2ray-rules-dat/releases/latest \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("published_at",""))')
          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> $GITHUB_ENV

          if [ -z "$UPSTREAM_TAG" ] || [ -z "$UPSTREAM_PUBLISHED" ]; then
            echo "upstream_tag is empty, abort"
            echo "built=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Manual dispatch skips the 2h wait (user explicitly asked to run now).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: skip 2h guard"
            echo "built=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Convert published_at to epoch (GNU date), compute age in seconds.
          UP_EPOCH=$(date -d "$UPSTREAM_PUBLISHED" +%s)
          NOW_EPOCH=$(date -u +%s)
          AGE=$(( NOW_EPOCH - UP_EPOCH ))
          echo "upstream published=$UPSTREAM_PUBLISHED age=${AGE}s"

          # Idempotency: find the upstream_tag recorded in this repo's latest release body.
          LAST_TAG=""
          LAST_BODY=$(curl -fsSL --retry 2 -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("body",""))' 2>/dev/null || true)
          if [ -n "$LAST_BODY" ]; then
            LAST_TAG=$(printf '%s' "$LAST_BODY" | sed -n 's/.*upstream: *\([^[:space:]]*\).*/\1/p' | head -1)
          fi
          echo "last built upstream tag: ${LAST_TAG:-none}"

          if [ "$LAST_TAG" = "$UPSTREAM_TAG" ]; then
            echo "Already built for upstream $UPSTREAM_TAG, skip."
            echo "built=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$AGE" -lt 7200 ]; then
            echo "Upstream updated less than 2 hours ago (${AGE}s), skip."
            echo "built=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "built=true" >> $GITHUB_OUTPUT

      - name: Stop if no build needed
        if: steps.vars.outputs.built != 'true'
        run: echo "No build this run."

      - name: Checkout Loyalsoldier/domain-list-custom
        if: steps.vars.outputs.built == 'true'
        uses: actions/checkout@v4
        with:
          repository: Loyalsoldier/domain-list-custom
          path: custom

      - name: Checkout v2fly/domain-list-community
        if: steps.vars.outputs.built == 'true'
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Checkout cokebar/gfwlist2dnsmasq
        if: steps.vars.outputs.built == 'true'
        uses: actions/checkout@v4
        with:
          repository: cokebar/gfwlist2dnsmasq
          path: gfwlist2dnsmasq

      - name: Setup Go
        if: steps.vars.outputs.built == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ./custom/go.mod
          cache-dependency-path: ./custom/go.sum

      - name: Get geoip.dat related files
        if: steps.vars.outputs.built == 'true'
        run: |
          wget -q https://github.com/Loyalsoldier/geoip/raw/release/geoip.dat
          wget -q https://github.com/Loyalsoldier/geoip/raw/release/geoip.dat.sha256sum

      - name: Generate GFWList domains
        if: steps.vars.outputs.built == 'true'
        run: |
          cd gfwlist2dnsmasq || exit 1
          chmod +x ./gfwlist2dnsmasq.sh
          ./gfwlist2dnsmasq.sh -l -o ./temp-gfwlist.txt

      - name: Get and add direct domains
        if: steps.vars.outputs.built == 'true'
        run: |
          curl -L --retry 3 --fail-with-body "$CHINA_DOMAINS_URL" | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > temp-direct.txt
          curl -L --retry 3 --fail-with-body "$CUSTOM_DIRECT" | perl -ne '/^(domain):([^:]+)(\n$|:@.+)/ && print "$2\n"' >> temp-direct.txt

      - name: Get and add proxy domains
        if: steps.vars.outputs.built == 'true'
        run: |
          cat ./gfwlist2dnsmasq/temp-gfwlist.txt | perl -ne '/^((?=^.{3,255})[a-zA-Z0-9][-_a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-_a-zA-Z0-9]{0,62})+)/ && print "$1\n"' > temp-proxy.txt
          curl -L --retry 3 --fail-with-body "$GOOGLE_DOMAINS_URL" | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' >> temp-proxy.txt
          curl -L --retry 3 --fail-with-body "$APPLE_DOMAINS_URL" | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' >> temp-proxy.txt
          curl -L --retry 3 --fail-with-body "$CUSTOM_PROXY" | perl -ne 'next if /:\@cn/; /^(domain):([^:]+)(\n$|:@.+)/ && print "$2\n"' >> temp-proxy.txt

      - name: Get and add reject domains (upstream sources)
        if: steps.vars.outputs.built == 'true'
        run: |
          curl -L --retry 3 --fail-with-body "$EASYLISTCHINA_EASYLIST_REJECT_URL" | perl -ne '/^\|\|([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})\^$/ && print "$1\n"' | perl -ne 'print if not /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/' > temp-reject.txt
          curl -L --retry 3 --fail-with-body "$ADGUARD_DNS_REJECT_URL" | perl -ne '/^\|\|([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})\^$/ && print "$1\n"' | perl -ne 'print if not /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/' >> temp-reject.txt
          curl -L --retry 3 --fail-with-body "$PETERLOWE_REJECT_URL" | perl -ne '/^127\.0\.0\.1\s([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})$/ && print "$1\n"' >> temp-reject.txt
          curl -L --retry 3 --fail-with-body "$DANPOLLOCK_REJECT_URL" | perl -ne '/^127\.0\.0\.1\s([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})/ && print "$1\n"' | sed '1d' >> temp-reject.txt

      - name: Get and add NetForgeCN custom ad domains
        if: steps.vars.outputs.built == 'true'
        run: |
          # anti-AD: plain domains, skip # metadata/comments
          curl -L --retry 3 --fail-with-body "$ANTIAD_URL" \
            | perl -ne 'next if /^\s*#/; /^([a-zA-Z0-9][-_a-zA-Z0-9]*(\.[a-zA-Z0-9][-_a-zA-Z0-9]*)+)$/ && print "$1\n"' >> temp-reject.txt
          # Cats-Team AdRules mosdns: domain: prefix
          curl -L --retry 3 --fail-with-body "$ADRULES_URL" \
            | perl -ne 'next if /^\s*#/; /^domain:([a-zA-Z0-9][-_a-zA-Z0-9]*(\.[a-zA-Z0-9][-_a-zA-Z0-9]*)+)$/ && print "$1\n"' >> temp-reject.txt
          # neodevhost: plain domains, skip # metadata/comments
          curl -L --retry 3 --fail-with-body "$NEODEV_URL" \
            | perl -ne 'next if /^\s*#/; /^([a-zA-Z0-9][-_a-zA-Z0-9]*(\.[a-zA-Z0-9][-_a-zA-Z0-9]*)+)$/ && print "$1\n"' >> temp-reject.txt
          # Save the three custom lists separately to build dedicated tags
          curl -L --retry 3 --fail-with-body "$ANTIAD_URL" \
            | perl -ne 'next if /^\s*#/; /^([a-zA-Z0-9][-_a-zA-Z0-9]*(\.[a-zA-Z0-9][-_a-zA-Z0-9]*)+)$/ && print "$1\n"' | sort --ignore-case -u > temp-netforge-antiad.txt
          curl -L --retry 3 --fail-with-body "$ADRULES_URL" \
            | perl -ne 'next if /^\s*#/; /^domain:([a-zA-Z0-9][-_a-zA-Z0-9]*(\.[a-zA-Z0-9][-_a-zA-Z0-9]*)+)$/ && print "$1\n"' | sort --ignore-case -u > temp-netforge-adrules.txt
          curl -L --retry 3 --fail-with-body "$NEODEV_URL" \
            | perl -ne 'next if /^\s*#/; /^([a-zA-Z0-9][-_a-zA-Z0-9]*(\.[a-zA-Z0-9][-_a-zA-Z0-9]*)+)$/ && print "$1\n"' | sort --ignore-case -u > temp-netforge-neodev.txt
          cat temp-netforge-antiad.txt temp-netforge-adrules.txt temp-netforge-neodev.txt | sort --ignore-case -u > temp-netforge-ads.txt
          wc -l temp-netforge-*.txt

      - name: Reserve special rules from custom lists
        if: steps.vars.outputs.built == 'true'
        run: |
          curl -L --retry 3 --fail-with-body "$CUSTOM_DIRECT" | perl -ne '/^((full|regexp|keyword):[^:]+)(\n$|:@.+)/ && print "$1\n"' | sort --ignore-case -u > direct-reserve.txt
          curl -L --retry 3 --fail-with-body "$CUSTOM_PROXY" | perl -ne 'next if /:\@cn/; /^((full|regexp|keyword):[^:]+)(\n$|:@.+)/ && print "$1\n"' | sort --ignore-case -u > proxy-reserve.txt

      - name: Add override domains from this repo
        if: steps.vars.outputs.built == 'true'
        run: |
          cat ./selfrepo/override/proxy.txt >> temp-proxy.txt
          cat ./selfrepo/override/direct.txt >> temp-direct.txt
          cat ./selfrepo/override/reject.txt >> temp-reject.txt

      - name: Sort and generate redundant lists
        if: steps.vars.outputs.built == 'true'
        run: |
          cat temp-proxy.txt | sort --ignore-case -u > proxy-list-with-redundant
          cat temp-direct.txt | sort --ignore-case -u > direct-list-with-redundant
          cat temp-reject.txt | sort --ignore-case -u > reject-list-with-redundant

      - name: Remove redundant domains
        if: steps.vars.outputs.built == 'true'
        run: |
          cp ./selfrepo/override/findRedundantDomain.py .
          chmod +x findRedundantDomain.py
          ./findRedundantDomain.py ./direct-list-with-redundant ./direct-list-deleted-unsort
          ./findRedundantDomain.py ./proxy-list-with-redundant ./proxy-list-deleted-unsort
          ./findRedundantDomain.py ./reject-list-with-redundant ./reject-list-deleted-unsort
          [ ! -f "direct-list-deleted-unsort" ] && touch direct-list-deleted-unsort
          [ ! -f "proxy-list-deleted-unsort" ] && touch proxy-list-deleted-unsort
          [ ! -f "reject-list-deleted-unsort" ] && touch reject-list-deleted-unsort
          grep -Fvxif ./direct-list-deleted-unsort ./direct-list-with-redundant > ./direct-list-without-redundant || [ "$?" -eq 1 ]
          grep -Fvxif ./proxy-list-deleted-unsort ./proxy-list-with-redundant > ./proxy-list-without-redundant || [ "$?" -eq 1 ]
          grep -Fvxif ./reject-list-deleted-unsort ./reject-list-with-redundant > ./reject-list-without-redundant || [ "$?" -eq 1 ]

      - name: Remove need-to-remove domains
        if: steps.vars.outputs.built == 'true'
        run: |
          grep -Fvxif ./selfrepo/override/direct-need-to-remove.txt ./direct-list-without-redundant > temp-cn.txt || [ "$?" -eq 1 ]
          grep -Fvxif ./selfrepo/override/proxy-need-to-remove.txt ./proxy-list-without-redundant > temp-geolocation-\!cn.txt || [ "$?" -eq 1 ]
          grep -Fvxif ./selfrepo/override/reject-need-to-remove.txt ./reject-list-without-redundant > temp-category-ads-all.txt || [ "$?" -eq 1 ]

      - name: Write core lists to data directory
        if: steps.vars.outputs.built == 'true'
        run: |
          cat temp-cn.txt | sort --ignore-case -u | perl -ne '/^((?=^.{1,255})[a-zA-Z0-9][-_a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-_a-zA-Z0-9]{0,62})*)/ && print "$1\n"' > ./community/data/cn
          cat temp-geolocation-\!cn.txt | sort --ignore-case -u | perl -ne '/^((?=^.{1,255})[a-zA-Z0-9][-_a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-_a-zA-Z0-9]{0,62})*)/ && print "$1\n"' > ./community/data/geolocation-\!cn
          cat temp-category-ads-all.txt | sort --ignore-case -u | perl -ne '/^((?=^.{1,255})[a-zA-Z0-9][-_a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-_a-zA-Z0-9]{0,62})*)/ && print "$1\n"' > ./community/data/category-ads-all

      - name: Write NetForgeCN custom tags to data directory
        if: steps.vars.outputs.built == 'true'
        run: |
          cat temp-netforge-antiad.txt | sort --ignore-case -u > ./community/data/netforge-antiad
          cat temp-netforge-adrules.txt | sort --ignore-case -u > ./community/data/netforge-adrules
          cat temp-netforge-neodev.txt | sort --ignore-case -u > ./community/data/netforge-neodev
          cat temp-netforge-ads.txt | sort --ignore-case -u > ./community/data/netforge-ads
          echo "custom tags written:"
          wc -l ./community/data/netforge-*

      - name: Add special rules back
        if: steps.vars.outputs.built == 'true'
        run: |
          [ -f "direct-reserve.txt" ] && cat direct-reserve.txt >> ./community/data/cn
          [ -f "proxy-reserve.txt" ] && cat proxy-reserve.txt >> ./community/data/geolocation-\!cn
          cp ./community/data/cn direct-list.txt
          cp ./community/data/geolocation-\!cn proxy-list.txt
          cp ./community/data/category-ads-all reject-list.txt
          cp ./community/data/netforge-ads netforge-ads.txt

      - name: Create extra tags
        if: steps.vars.outputs.built == 'true'
        run: |
          curl -L --retry 3 --fail-with-body "$CHINA_DOMAINS_URL" | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > ./community/data/china-list
          curl -L --retry 3 --fail-with-body "$CHINA_DOMAINS_URL" | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > china-list.txt
          curl -L --retry 3 --fail-with-body "$GOOGLE_DOMAINS_URL" | perl -ne '/^server=\/([^\/]+)\// && print "full:$1\n"' > ./community/data/google-cn
          curl -L --retry 3 --fail-with-body "$GOOGLE_DOMAINS_URL" | perl -ne '/^server=\/([^\/]+)\// && print "full:$1\n"' > google-cn.txt
          curl -L --retry 3 --fail-with-body "$APPLE_DOMAINS_URL" | perl -ne '/^server=\/([^\/]+)\// && print "full:$1\n"' > ./community/data/apple-cn
          curl -L --retry 3 --fail-with-body "$APPLE_DOMAINS_URL" | perl -ne '/^server=\/([^\/]+)\// && print "full:$1\n"' > apple-cn.txt
          cat ./gfwlist2dnsmasq/temp-gfwlist.txt | perl -ne '/^((?=^.{3,255})[a-zA-Z0-9][-_a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-_a-zA-Z0-9]{0,62})+)/ && print "$1\n"' >> ./community/data/gfw
          cat ./community/data/gfw | sort --ignore-case -u > gfw.txt
          cat ./community/data/greatfire | sort --ignore-case -u > greatfire.txt
          curl -L --retry 3 --fail-with-body "$WIN_SPY" | grep "0.0.0.0" | awk '{print $2}' > ./community/data/win-spy
          curl -L --retry 3 --fail-with-body "$WIN_SPY" | grep "0.0.0.0" | awk '{print $2}' > win-spy.txt
          curl -L --retry 3 --fail-with-body "$WIN_UPDATE" | grep "0.0.0.0" | awk '{print $2}' > ./community/data/win-update
          curl -L --retry 3 --fail-with-body "$WIN_UPDATE" | grep "0.0.0.0" | awk '{print $2}' > win-update.txt
          curl -L --retry 3 --fail-with-body "$WIN_EXTRA" | grep "0.0.0.0" | awk '{print $2}' > ./community/data/win-extra
          curl -L --retry 3 --fail-with-body "$WIN_EXTRA" | grep "0.0.0.0" | awk '{print $2}' > win-extra.txt

      - name: Build geosite.dat file
        if: steps.vars.outputs.built == 'true'
        run: |
          cd custom || exit 1
          go run ./ --datapath=../community/data

      - name: Move and zip files and generate sha256
        if: steps.vars.outputs.built == 'true'
        run: |
          install -Dp ./geoip.dat ./publish/geoip.dat
          install -Dp ./geoip.dat.sha256sum ./publish/geoip.dat.sha256sum
          install -Dp ./custom/publish/geosite.dat ./publish/geosite.dat
          install -p {proxy,direct,reject}-list.txt ./publish/
          install -p {china-list,apple-cn,google-cn,gfw,greatfire,win-spy,win-update,win-extra}.txt ./publish/
          install -p netforge-ads.txt netforge-antiad.txt netforge-adrules.txt netforge-neodev.txt ./publish/ 2>/dev/null || true
          cp ./community/data/netforge-antiad ./publish/netforge-antiad.txt
          cp ./community/data/netforge-adrules ./publish/netforge-adrules.txt
          cp ./community/data/netforge-neodev ./publish/netforge-neodev.txt
          cd ./publish || exit 1
          zip rules.zip {proxy,direct,reject}-list.txt geoip.dat geosite.dat
          sha256sum geosite.dat > geosite.dat.sha256sum
          sha256sum netforge-ads.txt > netforge-ads.txt.sha256sum

      - name: Release and upload assets
        if: steps.vars.outputs.built == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
          body: |
            upstream: ${{ env.UPSTREAM_TAG }}

            Self-maintained rules. Extra tags: netforge-antiad, netforge-adrules, netforge-neodev, netforge-ads (all merged into category-ads-all).
          file_glob: true
          file: ./publish/*
          overwrite: true

      - name: Git push assets to "release" branch
        if: steps.vars.outputs.built == 'true'
        run: |
          cd publish || exit 1
          git init -q
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}" -q
          git push -f -u "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" release:release

      - name: Purge jsdelivr CDN
        if: steps.vars.outputs.built == 'true'
        run: |
          cd publish || exit 1
          for file in $(ls); do
            curl -s -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}" > /dev/null || true
          done
